# Render service declaration for Annabelle's Cat Runner
# Reference: https://render.com/docs/web-services
#
# IMPORTANT (per standing order): all services on this team are WEB SERVICES,
# not Static Sites and not Blueprints. This file is kept for documentation
# only — service is created manually from Render's side (see bootstrap.sh).
#
# Service is a Node web service that serves the static game via serve.js.
# Required Render dashboard settings (trigger manually from your side):
#   - Type:        Web Service
#   - Runtime:     Node
#   - Branch:      2026-07-25__methodical-notes__initial-cat-runner-game
#   - Build Cmd:   npm install --no-audit --no-fund
#   - Start Cmd:   node serve.js
#   - Plan:        Starter (free) is fine
#   - Health:      / (HTTP 200)
services:
  - type: web
    name: annabelle-catgame
    runtime: node
    autoDeploy: false          # deploys are triggered manually from Render's side
    buildCommand: npm install --no-audit --no-fund
    startCommand: node serve.js
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
