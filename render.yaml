# Render service declaration for Annabelle's Cat Runner
# Reference: https://render.com/docs/web-services
#
# IMPORTANT (per standing order): all services on this team are WEB SERVICES,
# not Static Sites and not Blueprints. This file is kept for documentation
# only — the service is created manually from Render's dashboard (see
# bootstrap.sh for the link and the manual steps below).
#
# Service is a Node web service that wraps the single index.html via serve.js.
# Required Render dashboard settings (set on the Render side when creating
# the Web Service):
#   - Type:        Web Service
#   - Runtime:     Node
#   - Branch:      2026-07-25__methodical-notes__initial-cat-runner-game
#   - Build Cmd:   npm install --no-audit --no-fund
#   - Start Cmd:   node serve.js
#   - Plan:        Starter (free) is fine
#   - Health:      / (HTTP 200)
#   - Env Var:     NODE_VERSION=20
#
# Auto-deploy is OFF — the operator (Luis) triggers deploys manually from
# the Render dashboard after each commit lands on the tracked branch.
