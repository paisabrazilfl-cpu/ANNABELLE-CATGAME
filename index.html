<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annabelle's Cat Country</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0d0f18;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(255,165,0,0.2);
      overflow: hidden;
      border: 4px solid #2a2d3d;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-weight: 800;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      z-index: 10;
    }
    .hud-group {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
    }
    .hud-item {
      font-size: 18px;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-item span {
      color: #fff;
    }
    .controls-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.5);
      padding: 4px 12px;
      border-radius: 10px;
      pointer-events: none;
    }
    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      justify-content: space-between;
      z-index: 20;
    }
    @media (max-width: 980px) {
      #game-container {
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
      #mobile-controls {
        display: flex;
      }
    }
    .btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      touch-action: manipulation;
    }
    .btn:active {
      background: rgba(255,165,0,0.6);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div class="hud-group">
      <div class="hud-item">SCORE: <span id="val-score">00000</span></div>
      <div class="hud-item">🐟 <span id="val-fish">0</span></div>
    </div>
    <div class="hud-item" style="font-size: 20px; color: #ff5555;">ANNABELLE'S COUNTRY</div>
    <div class="hud-group">
      <div class="hud-item">STAGE: <span id="val-stage">1-1</span></div>
      <div class="hud-item">❤️ <span id="val-lives">3</span></div>
    </div>
  </div>

  <canvas id="canvas" width="960" height="540"></canvas>
  <div class="controls-hint">A/D or ◄/►: Run | SPACE/W/▲: Jump | S/▼: Roll/Duck | R: Restart Stage</div>

  <div id="mobile-controls">
    <div style="display:flex; gap:10px;">
      <div class="btn" id="btn-left">◄</div>
      <div class="btn" id="btn-right">►</div>
      <div class="btn" id="btn-down">▼</div>
    </div>
    <div style="display:flex; gap:10px;">
      <div class="btn" id="btn-jump" style="width:60px; height:60px; background:rgba(255,165,0,0.4)">JUMP</div>
    </div>
  </div>
</div>

<script>
/**
 * Annabelle's Cat Country Engine
 * SNES DKC Aesthetic Platformer Engine
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
const STATE = {
  score: 0,
  fish: 0,
  lives: 3,
  stageIndex: 0,
  cameraX: 0,
  gameOver: false,
  stageComplete: false,
  shakeTimer: 0
};

// --- INPUT HANDLER ---
const keys = { left: false, right: false, up: false, down: false, jump: false, restart: false };

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
  if (e.key === ' ' || e.key === 'Spacebar') keys.jump = true;
  if (e.key === 'r' || e.key === 'R') resetStage();
});

window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
  if (e.key === ' ' || e.key === 'Spacebar') keys.jump = false;
});

// Mobile button listeners
const bindBtn = (id, key) => {
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-down', 'down');
bindBtn('btn-jump', 'jump');

// --- LEVEL DESIGN & THEMES ---
const STAGES = [
  {
    name: "Jungle Hijinks",
    theme: "jungle",
    length: 3200,
    bgColor: "#091c10",
    canopyColor: "#0f3a18",
    soilColor: "#5c3d1e",
    platforms: [
      { x: 0, y: 480, w: 900, h: 60 },
      { x: 1000, y: 480, w: 800, h: 60 },
      { x: 1900, y: 480, w: 1300, h: 60 },
      // Elevated wood platforms
      { x: 300, y: 360, w: 180, h: 20 },
      { x: 550, y: 280, w: 200, h: 20 },
      { x: 1100, y: 350, w: 160, h: 20 },
      { x: 1350, y: 260, w: 180, h: 20 },
      { x: 1600, y: 360, w: 140, h: 20 },
      { x: 2050, y: 340, w: 220, h: 20 },
      { x: 2350, y: 250, w: 200, h: 20 }
    ],
    barrels: [
      { x: 820, y: 380, targetVx: 12, targetVy: -8 },
      { x: 1820, y: 360, targetVx: 10, targetVy: -10 }
    ],
    enemies: [
      { x: 450, y: 450, type: "kritter", minX: 350, maxX: 700 },
      { x: 1200, y: 450, type: "kritter", minX: 1050, maxX: 1400 },
      { x: 1400, y: 220, type: "klaptrap", minX: 1350, maxX: 1500 },
      { x: 2100, y: 450, type: "kritter", minX: 1950, maxX: 2300 },
      { x: 2500, y: 450, type: "klaptrap", minX: 2400, maxX: 2700 }
    ],
    collectibles: [
      { x: 320, y: 320, type: "fish" }, { x: 350, y: 320, type: "fish" }, { x: 380, y: 320, type: "fish" },
      { x: 600, y: 230, type: "letter", val: "K" },
      { x: 1150, y: 300, type: "fish" }, { x: 1380, y: 210, type: "letter", val: "O" },
      { x: 2100, y: 290, type: "letter", val: "N" },
      { x: 2400, y: 200, type: "letter", val: "G" }
    ],
    exitX: 3050
  },
  {
    name: "Mineshaft Madness",
    theme: "mine",
    length: 3400,
    bgColor: "#120e18",
    canopyColor: "#261a33",
    soilColor: "#2b2636",
    platforms: [
      { x: 0, y: 480, w: 600, h: 60 },
      { x: 700, y: 480, w: 600, h: 60 },
      { x: 1400, y: 480, w: 700, h: 60 },
      { x: 2200, y: 480, w: 1000, h: 60 },
      // Ledges
      { x: 250, y: 360, w: 150, h: 20 },
      { x: 750, y: 350, w: 180, h: 20 },
      { x: 1000, y: 250, w: 180, h: 20 },
      { x: 1500, y: 340, w: 200, h: 20 },
      { x: 1800, y: 240, w: 200, h: 20 },
      { x: 2350, y: 350, w: 180, h: 20 }
    ],
    barrels: [
      { x: 550, y: 380, targetVx: 11, targetVy: -6 },
      { x: 1320, y: 360, targetVx: 12, targetVy: -7 },
      { x: 2120, y: 360, targetVx: 10, targetVy: -9 }
    ],
    enemies: [
      { x: 300, y: 320, type: "klaptrap", minX: 250, maxX: 380 },
      { x: 800, y: 450, type: "kritter", minX: 720, maxX: 1100 },
      { x: 1550, y: 300, type: "klaptrap", minX: 1500, maxX: 1680 },
      { x: 2300, y: 450, type: "kritter", minX: 2220, maxX: 2600 },
      { x: 2700, y: 450, type: "kritter", minX: 2600, maxX: 2900 }
    ],
    collectibles: [
      { x: 280, y: 310, type: "letter", val: "K" },
      { x: 800, y: 300, type: "fish" }, { x: 830, y: 300, type: "fish" },
      { x: 1050, y: 200, type: "letter", val: "O" },
      { x: 1850, y: 190, type: "letter", val: "N" },
      { x: 2400, y: 300, type: "letter", val: "G" }
    ],
    exitX: 3100
  }
];

// --- PLAYER OBJECT (ANNABELLE THE CAT) ---
class Player {
  constructor() {
    this.x = 80;
    this.y = 300;
    this.w = 38;
    this.h = 46;
    this.vx = 0;
    this.vy = 0;
    this.speed = 5.5;
    this.jumpForce = -13.5;
    this.grounded = false;
    this.facing = 'right';
    this.isRolling = false;
    this.rollTimer = 0;
    this.animFrame = 0;
    this.animTimer = 0;
    this.inBarrel = false;
    this.currentBarrel = null;
    this.invulnerable = 0;
  }

  reset(x = 80, y = 300) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.grounded = false;
    this.isRolling = false;
    this.inBarrel = false;
    this.currentBarrel = null;
    this.invulnerable = 0;
  }

  update(stage) {
    if (this.invulnerable > 0) this.invulnerable--;

    if (this.inBarrel) {
      this.x = this.currentBarrel.x + 10;
      this.y = this.currentBarrel.y + 10;
      if (keys.jump) {
        this.inBarrel = false;
        this.vx = this.currentBarrel.targetVx;
        this.vy = this.currentBarrel.targetVy;
        STATE.shakeTimer = 8;
        keys.jump = false;
      }
      return;
    }

    // Rolling Mechanic (DKC Style Roll)
    if (keys.down && !this.isRolling && this.grounded) {
      this.isRolling = true;
      this.rollTimer = 25;
    }

    if (this.isRolling) {
      this.rollTimer--;
      this.vx = (this.facing === 'right' ? 1 : -1) * 8;
      if (this.rollTimer <= 0) {
        this.isRolling = false;
      }
    } else {
      // Normal Horizontal Control
      if (keys.left) {
        this.vx = -this.speed;
        this.facing = 'left';
      } else if (keys.right) {
        this.vx = this.speed;
        this.facing = 'right';
      } else {
        this.vx *= 0.7;
      }
    }

    // Jump
    if (keys.jump && this.grounded) {
      this.vy = this.jumpForce;
      this.grounded = false;
      keys.jump = false;
    }

    // Gravity
    this.vy += 0.65;

    // Apply movement
    this.x += this.vx;
    this.checkCollisionsX(stage.platforms);

    this.y += this.vy;
    this.grounded = false;
    this.checkCollisionsY(stage.platforms);

    // Fall in pit
    if (this.y > 600) {
      playerHit();
    }

    // Animation Tick
    this.animTimer++;
    if (this.animTimer % 6 === 0) {
      this.animFrame = (this.animFrame + 1) % 4;
    }
  }

  checkCollisionsX(platforms) {
    for (let p of platforms) {
      if (this.x < p.x + p.w && this.x + this.w > p.x &&
          this.y < p.y + p.h && this.y + this.h > p.y) {
        if (this.vx > 0) this.x = p.x - this.w;
        else if (this.vx < 0) this.x = p.x + p.w;
      }
    }
  }

  checkCollisionsY(platforms) {
    for (let p of platforms) {
      if (this.x < p.x + p.w && this.x + this.w > p.x &&
          this.y < p.y + p.h && this.y + this.h > p.y) {
        if (this.vy > 0) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.grounded = true;
        } else if (this.vy < 0) {
          this.y = p.y + p.h;
          this.vy = 0;
        }
      }
    }
  }

  draw(ctx, camX) {
    if (this.inBarrel) return;
    if (this.invulnerable % 4 >= 2) return; // Flash effect

    ctx.save();
    ctx.translate(this.x - camX + this.w/2, this.y + this.h/2);
    if (this.facing === 'left') ctx.scale(-1, 1);

    // Render DKC-styled 2.5D Pixel Cat (Annabelle)
    if (this.isRolling) {
      // Rolling Ball Sprite
      ctx.rotate((this.animTimer * 0.3));
      ctx.fillStyle = "#e07a1f";
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(6, -4, 6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Cat Body (3D pre-rendered look)
      let bounce = this.grounded && Math.abs(this.vx) > 0.5 ? Math.sin(this.animTimer * 0.3) * 3 : 0;

      // Tail
      ctx.strokeStyle = "#b35409";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-12, 5);
      ctx.quadraticCurveTo(-22, -10 + bounce, -18, -18);
      ctx.stroke();

      // Body Gradient
      let grad = ctx.createLinearGradient(-15, -15, 15, 20);
      grad.addColorStop(0, "#fca142");
      grad.addColorStop(0.7, "#d96b0c");
      grad.addColorStop(1, "#8a3e00");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(-16, -16 + bounce, 32, 34, 10);
      ctx.fill();

      // Belly Patch
      ctx.fillStyle = "#fff3db";
      ctx.beginPath();
      ctx.ellipse(2, 2 + bounce, 10, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(4, -14 + bounce, 14, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = "#b35409";
      ctx.beginPath();
      ctx.moveTo(-5, -24 + bounce); ctx.lineTo(2, -32 + bounce); ctx.lineTo(6, -24 + bounce); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(4, -24 + bounce); ctx.lineTo(12, -32 + bounce); ctx.lineTo(15, -22 + bounce); ctx.fill();

      // Eyes
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(8, -16 + bounce, 2.5, 0, Math.PI * 2);
      ctx.arc(14, -16 + bounce, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Catchlight
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(7, -17 + bounce, 1, 0, Math.PI * 2);
      ctx.arc(13, -17 + bounce, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

// --- GAME INSTANCES ---
const player = new Player();
let currentStage = STAGES[0];

function resetStage() {
  player.reset(80, 300);
  STATE.gameOver = false;
  STATE.stageComplete = false;
  // Deep clone level objects for reset state
  currentStage = JSON.parse(JSON.stringify(STAGES[STATE.stageIndex]));
}

function playerHit() {
  if (player.invulnerable > 0) return;
  STATE.lives--;
  STATE.shakeTimer = 15;
  document.getElementById('val-lives').innerText = STATE.lives;
  if (STATE.lives <= 0) {
    STATE.gameOver = true;
  } else {
    player.reset(80, 300);
  }
}

// --- RENDERING DKC ATMOSPHERIC BACKGROUNDS ---
function drawDKCBackground(ctx, stage, camX) {
  // Parallax Sky & Jungle/Mine Gradients
  let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (stage.theme === "jungle") {
    bgGrad.addColorStop(0, "#08140c");
    bgGrad.addColorStop(0.5, "#14331d");
    bgGrad.addColorStop(1, "#281b0a");
  } else {
    bgGrad.addColorStop(0, "#0d0914");
    bgGrad.addColorStop(0.6, "#221833");
    bgGrad.addColorStop(1, "#120c1a");
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Layer 1: Distant Trees / Mine Pillars (Parallax 0.2)
  ctx.fillStyle = stage.canopyColor;
  for (let i = -100; i < stage.length; i += 180) {
    let x = (i - camX * 0.2);
    if (stage.theme === "jungle") {
      ctx.beginPath();
      ctx.arc(x, 180, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - 20, 180, 40, 300);
    } else {
      ctx.fillRect(x, 0, 50, 540);
    }
  }

  // Layer 2: Midground Foliage (Parallax 0.5)
  ctx.fillStyle = stage.theme === "jungle" ? "#1b5228" : "#3b2b52";
  for (let i = -50; i < stage.length; i += 120) {
    let x = (i - camX * 0.5);
    ctx.beginPath();
    ctx.arc(x, 260, 60, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- PLATFORM & SCENERY RENDERER ---
function drawPlatforms(ctx, stage, camX) {
  for (let p of stage.platforms) {
    if (p.x + p.w < camX || p.x > camX + canvas.width) continue;

    // Pre-rendered 3D Ground Look
    let topGrad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    if (stage.theme === "jungle") {
      topGrad.addColorStop(0, "#4e8c2b");
      topGrad.addColorStop(0.2, "#2b5415");
      topGrad.addColorStop(0.21, "#61421f");
      topGrad.addColorStop(1, "#2e1d0a");
    } else {
      topGrad.addColorStop(0, "#5a506b");
      topGrad.addColorStop(0.2, "#362f42");
      topGrad.addColorStop(0.21, "#211c29");
      topGrad.addColorStop(1, "#0d0a12");
    }

    ctx.fillStyle = topGrad;
    ctx.fillRect(p.x - camX, p.y, p.w, p.h);

    // Bevel & Grass trim
    ctx.fillStyle = stage.theme === "jungle" ? "#72bd3c" : "#7c6f94";
    ctx.fillRect(p.x - camX, p.y, p.w, 4);

    // Wood Struts/Supports under platforms
    if (p.h < 30) {
      ctx.fillStyle = "#3a2312";
      ctx.fillRect(p.x - camX + 15, p.y + p.h, 10, 120);
      ctx.fillRect(p.x - camX + p.w - 25, p.y + p.h, 10, 120);
    }
  }
}

// --- BARREL, ENEMIES & COLLECTIBLES RENDERER ---
function updateAndDrawEntities(ctx, stage, camX) {
  // 1. Barrels (DKC Launch Barrels)
  for (let b of stage.barrels) {
    let bx = b.x - camX;
    if (bx < -50 || bx > canvas.width + 50) continue;

    // Check interaction
    let dist = Math.hypot((player.x + player.w/2) - (b.x + 20), (player.y + player.h/2) - (b.y + 20));
    if (dist < 30 && !player.inBarrel) {
      player.inBarrel = true;
      player.currentBarrel = b;
      player.vx = 0; player.vy = 0;
    }

    // Render Barrel
    ctx.save();
    ctx.translate(bx + 20, b.y + 20);
    let bGrad = ctx.createLinearGradient(-20, -20, 20, 20);
    bGrad.addColorStop(0, "#ab6b29");
    bGrad.addColorStop(0.5, "#6e3f0e");
    bGrad.addColorStop(1, "#361c02");
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d4af37";
    ctx.lineWidth = 4;
    ctx.stroke();

    // White DK Style Arrow
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(10, 8); ctx.lineTo(-10, 8); ctx.fill();
    ctx.restore();
  }

  // 2. Enemies (Kritter & Klaptrap)
  for (let e of stage.enemies) {
    if (!e.alive && e.alive !== undefined) continue;

    // AI Patrol
    e.x += (e.dir || 1) * (e.type === "klaptrap" ? 3 : 1.5);
    if (!e.dir) e.dir = 1;
    if (e.x > e.maxX) e.dir = -1;
    if (e.x < e.minX) e.dir = 1;

    let ex = e.x - camX;
    if (ex < -60 || ex > canvas.width + 60) continue;

    // Collision with Player
    if (Math.abs((player.x + player.w/2) - (e.x + 20)) < 28 &&
        Math.abs((player.y + player.h/2) - (e.y + 20)) < 28) {
      if (player.isRolling || player.vy > 1) {
        // Stomp / Roll Defeat
        e.alive = false;
        player.vy = -9;
        STATE.score += 200;
        document.getElementById('val-score').innerText = String(STATE.score).padStart(5, '0');
      } else {
        playerHit();
      }
    }

    // Render Enemy
    ctx.save();
    ctx.translate(ex + 20, e.y + 20);
    if (e.dir === -1) ctx.scale(-1, 1);

    if (e.type === "kritter") {
      // Green Kremling
      ctx.fillStyle = "#2d8a3e";
      ctx.beginPath(); ctx.roundRect(-16, -20, 32, 40, 6); ctx.fill();
      ctx.fillStyle = "#d4b837"; // Belly
      ctx.fillRect(-6, -10, 16, 24);
      ctx.fillStyle = "#f00"; // Red Eyes
      ctx.beginPath(); ctx.arc(6, -12, 4, 0, Math.PI*2); ctx.fill();
    } else {
      // Purple Klaptrap (Snapping Crocodile)
      ctx.fillStyle = "#7a288a";
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fff"; // Big Teeth
      ctx.fillRect(2, 0, 14, 10);
      ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(4, -8, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // 3. Collectibles (Fish & K-O-N-G Letters)
  for (let c of stage.collectibles) {
    if (c.collected) continue;
    let cx = c.x - camX;
    if (cx < -40 || cx > canvas.width + 40) continue;

    // Bobbing effect
    let bob = Math.sin(Date.now() * 0.005 + c.x) * 5;

    // Collection check
    if (Math.hypot((player.x + player.w/2) - c.x, (player.y + player.h/2) - (c.y + bob)) < 28) {
      c.collected = true;
      if (c.type === "fish") {
        STATE.fish++;
        STATE.score += 50;
        document.getElementById('val-fish').innerText = STATE.fish;
      } else {
        STATE.score += 500;
      }
      document.getElementById('val-score').innerText = String(STATE.score).padStart(5, '0');
    }

    // Draw Collectible
    ctx.save();
    ctx.translate(cx, c.y + bob);
    if (c.type === "fish") {
      ctx.fillStyle = "#4a9eff";
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-18, -6); ctx.lineTo(-18, 6); ctx.fill();
    } else {
      // K-O-N-G Letter Token
      ctx.fillStyle = "#ffd700";
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#cc9600"; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "#d00"; ctx.font = "900 18px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(c.val, 0, 1);
    }
    ctx.restore();
  }

  // 4. Exit Target / Goal
  let exitX = stage.exitX - camX;
  ctx.fillStyle = "#ffd700";
  ctx.fillRect(exitX, 380, 20, 100);
  ctx.fillStyle = "#ff2222";
  ctx.beginPath(); ctx.arc(exitX + 10, 380, 25, 0, Math.PI*2); ctx.fill();

  if (player.x > stage.exitX) {
    STATE.stageComplete = true;
  }
}

// --- MAIN GAME LOOP ---
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!STATE.gameOver && !STATE.stageComplete) {
    player.update(currentStage);

    // Smooth Camera Follow
    let targetCamX = player.x - canvas.width * 0.35;
    STATE.cameraX += (targetCamX - STATE.cameraX) * 0.1;
    STATE.cameraX = Math.max(0, Math.min(STATE.cameraX, currentStage.length - canvas.width));
  }

  // Camera Screen Shake effect
  ctx.save();
  if (STATE.shakeTimer > 0) {
    STATE.shakeTimer--;
    ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
  }

  // Render Pipeline
  drawDKCBackground(ctx, currentStage, STATE.cameraX);
  drawPlatforms(ctx, currentStage, STATE.cameraX);
  updateAndDrawEntities(ctx, currentStage, STATE.cameraX);
  player.draw(ctx, STATE.cameraX);

  ctx.restore();

  // Overlay Screens
  if (STATE.gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff3333";
    ctx.font = "900 48px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width/2, 240);
    ctx.fillStyle = "#fff";
    ctx.font = "20px sans-serif";
    ctx.fillText("Press 'R' to Restart Stage", canvas.width/2, 300);
  } else if (STATE.stageComplete) {
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4dff73";
    ctx.font = "900 42px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("STAGE CLEAR!", canvas.width/2, 220);

    if (STATE.stageIndex < STAGE_COUNT - 1) {
      ctx.fillStyle = "#fff";
      ctx.font = "20px sans-serif";
      ctx.fillText("Press JUMP or SPACE for Next Stage", canvas.width/2, 280);
      if (keys.jump) {
        STATE.stageIndex++;
        document.getElementById('val-stage').innerText = `1-${STATE.stageIndex + 1}`;
        resetStage();
      }
    } else {
      ctx.fillStyle = "#ffd700";
      ctx.font = "24px sans-serif";
      ctx.fillText("CONGRATULATIONS! YOU BEAT THE GAME!", canvas.width/2, 280);
    }
  }

  requestAnimationFrame(loop);
}

const STAGE_COUNT = STAGES.length;
resetStage();
requestAnimationFrame(loop);
</script>
